name: CI

on:
  push:
    branches: [ main, stage-gate ]
  pull_request:
    branches: [ main, stage-gate ]
  workflow_dispatch:

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax (compile all files)
        run: |
          python -m compileall -q app

      - name: Verify the app imports
        env:
          # Dummy values so config validation passes in CI (NOT real secrets).
          SECRET_KEY: ci-dummy-secret-key-not-used-in-production-0000000000
          FIELD_ENCRYPTION_KEY: ci-dummy-encryption-key-for-import-check-only=
          FIRO_RPC_USER: ci
          FIRO_RPC_PASSWORD: ci
          DATABASE_URL: "sqlite+aiosqlite:///./data/ci.db"
        run: |
          mkdir -p data
          python -c "from app.main import app; print('app imports OK,', len(app.routes), 'routes')"

      - name: Verify database tables build
        env:
          SECRET_KEY: ci-dummy-secret-key-not-used-in-production-0000000000
          FIELD_ENCRYPTION_KEY: ci-dummy-encryption-key-for-import-check-only=
          FIRO_RPC_USER: ci
          FIRO_RPC_PASSWORD: ci
          DATABASE_URL: "sqlite+aiosqlite:///./data/ci.db"
        run: |
          python -c "
          import asyncio
          from app.core.database import create_tables
          asyncio.run(create_tables())
          print('database tables created OK')
          "
