{% extends "base.html" %}
{% block title %}Verify Email — FiroGate{% endblock %}
{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,rgba(245,197,66,.06) 0%,transparent 55%)">
  <div style="width:100%;max-width:440px">
    <div style="text-align:center;margin-bottom:22px">
      <div style="display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:14px 4px 12px 6px;background:rgba(245,197,66,.08);border:1px solid rgba(245,197,66,.22)">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F5C542" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </div>
    </div>

    <div class="card glow-y" data-testid="verify-email-card">
      <h3 id="ve-title" style="text-align:center;margin-bottom:8px">Verifying your email…</h3>
      <p id="ve-msg" style="text-align:center;color:var(--t2);font-size:.88rem;margin-bottom:18px">Please wait a moment while we confirm your link.</p>
      <div id="ve-alert"></div>
      <div style="text-align:center;margin-top:10px">
        <a id="ve-cta" href="{{ login_url or '/login' }}" class="btn btn-y" style="display:none;text-decoration:none;padding:10px 22px" data-testid="verify-email-login-link">Go to Sign In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block js %}
<script>
(async function () {
  const params = new URLSearchParams(window.location.search);
  // Support THREE token sources, in priority order:
  //   1. action_token rendered by /auth/action dispatcher (most authoritative)
  //   2. oobCode — Firebase-standard query param from auth.firogate.com links
  //   3. token   — legacy param from older emails (backward-compat)
  const token  = {{ (action_token or '') | tojson }}
                 || params.get('oobCode') || params.get('token') || '';
  const title  = document.getElementById('ve-title');
  const msg    = document.getElementById('ve-msg');
  const cta    = document.getElementById('ve-cta');
  const alertE = document.getElementById('ve-alert');

  if (!token) {
    title.textContent = 'Invalid link';
    msg.textContent   = 'Please use the link from your email.';
    alertE.innerHTML  = alertHTML('Token missing.', 'err');
    return;
  }

  try {
    const r = await fetch('/api/auth/fb/verify-email', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      title.textContent = 'Link expired or invalid';
      msg.textContent   = data.detail || 'This link is invalid or has expired.';
      alertE.innerHTML  = alertHTML(data.detail || 'Verification failed.', 'err');
      return;
    }
    title.textContent = 'Verified';
    msg.textContent   = 'Click below to sign in.';
    alertE.innerHTML  = alertHTML('Email verified successfully.', 'ok');
    cta.style.display = 'inline-flex';
    // No auto-redirect — the user clicks "Go to Sign In" when ready.
    // This prevents surprise navigation while they're still reading the
    // confirmation, and lets them keep this tab open as a reference.
  } catch (e) {
    title.textContent = 'Network error';
    msg.textContent   = 'Please check your connection and try again.';
    alertE.innerHTML  = alertHTML('Network error.', 'err');
  }
})();
</script>
{% endblock %}
