body{font-family:'Space Grotesk',sans-serif;background:#0d0c0e;min-height:100vh;overflow-x:hidden}
button{cursor:pointer;font-family:inherit}

.simbar{
  position:fixed;bottom:18px;left:0;right:0;margin:0 auto;
  width:max-content;max-width:calc(100% - 24px);z-index:60;
  display:flex;gap:8px;align-items:center;padding:8px 10px;
  background:rgba(20,19,18,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid #2c2a29;border-radius:999px;box-shadow:0 14px 34px -10px rgba(0,0,0,.7);
}
.simbar .lbl{font:600 10px 'JetBrains Mono';letter-spacing:2px;color:#5a5754;padding:0 6px;text-transform:uppercase;white-space:nowrap}
.simbar button{
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  background:#232120;border:1px solid #2c2a29;color:#f0edea;
  font:600 12px 'Space Grotesk';padding:8px 15px;border-radius:999px;transition:all .2s;
}
.simbar button:hover{border-color:#8C8C8C;background:#2c2a29}
.simbar button.go{background:linear-gradient(140deg,#B82334,#8D1B28);border-color:transparent}
.simbar button.go:hover{filter:brightness(1.15)}
.simbar .sep{width:1px;height:22px;background:#2c2a29;flex-shrink:0}

.done{
  position:absolute;inset:0;z-index:8;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  gap:6px;text-align:center;padding:20px;
}
.theme-wrap.paid .done{display:flex;animation:tIn .4s cubic-bezier(.2,.9,.3,1)}

.dcheck{width:96px;height:96px}
.dcheck circle{fill:none;stroke:currentColor;stroke-width:3;stroke-dasharray:320;stroke-dashoffset:320;

.dcheck path{fill:none;stroke:currentColor;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;

.theme-wrap.paid .dcheck circle{animation:ddraw .8s cubic-bezier(.5,0,.3,1) forwards .1s}

.done .dt1{font-size:19px;font-weight:700;margin-top:8px;opacity:0;transform:translateY(8px)}

<script>
var payData = {
  amount_firo: 4.275,
  address: 'TWqcXieYcoAYCr1BiUYMBUKfBBt3rLD9gJ',
  merchant_app_name: 'Fen Digital Store',
  order_id: 'FG-2481-DEMO',
  is_testnet: false,
  status: 'pending',
};

function fmtFiro(v){
  const n = parseFloat(v);
  if (isNaN(n)) return '0.00';
  let s = n.toFixed(8);
  if (s.indexOf('.') !== -1) s = s.replace(/0+$/, '').replace(/\.$/, '');
  const dot = s.indexOf('.');
  const dec = dot === -1 ? 0 : s.length - dot - 1;
  const want = Math.max(2, dec + 1);
  if (dot === -1) return s + '.' + '0'.repeat(want);
  return dec < want ? s + '0'.repeat(want - dec) : s;
}
function _safe(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function _getPayAmt(){ return fmtFiro(payData.amount_firo); }
function _getAddr()  { return payData.address; }
function _getMerchant(){ return payData.merchant_app_name; }
function _getOrderId(){ return payData.order_id; }

var _layout = (new URLSearchParams(location.search)).get('layout') || 'terminal';

var _timerIntervals = [];
function _layoutStartTimer(timerId, barId, totalSec) {
  var remaining = totalSec;
  var el = document.getElementById(timerId);
  var bar = barId ? document.getElementById(barId) : null;
  function tick(){
    if(!el) return;
    var m = Math.floor(remaining/60), s = remaining%60;
    el.textContent = m+':'+(s<10?'0':'')+s;
    if(bar) bar.style.transform = 'scaleX('+(remaining/totalSec)+')';
    if(remaining > 0) remaining--;
  }
  tick();
  _timerIntervals.push(setInterval(tick, 1000));
}
