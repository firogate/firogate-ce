services:
  firogate:
    build: .
    container_name: firogate
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000", "--workers", "1"]
    volumes:
      - firogate_data:/app/data
      - firogate_logs:/app/logs
      # no --build needed the host filesystem rather than the frozen image contents.
      - ./app:/app/app
      - ./templates:/app/templates
      - ./static:/app/static
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  firogate_data:
    driver: local
  firogate_logs:
    driver: local
